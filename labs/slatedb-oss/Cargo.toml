[package]
name = "slatedb-oss"
version = "0.1.0"
edition = "2021"
description = "End-to-end verification, benchmarks, and thin KV service for SlateDB over Alibaba Cloud OSS via OpenDAL"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
object_store = "0.14.2"
object_store_opendal = "0.60.5"
opendal = { version = "0.59.5", features = ["services-oss"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slatedb = "0.18.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
