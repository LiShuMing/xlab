[project]
name = "xlab-daft-lab"
version = "0.1.0"
description = "Reproducible native Daft execution experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "daft==0.7.26",
    "numpy==2.2.6",
    "pyarrow==20.0.0",
    "psutil==7.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
