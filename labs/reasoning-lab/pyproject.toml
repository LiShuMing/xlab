[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reasoning-lab"
version = "0.1.0"
description = "A local Qwen3 SFT/GRPO and verifiable reasoning laboratory"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8,<3",
    "transformers>=4.51,<6",
    "safetensors>=0.5",
    "huggingface-hub>=0.34",
    "numpy>=1.26",
    "psutil>=6",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
reasoning-lab = "reasoning_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
