name: core-quality

on:
  push:
    paths:
      - 'labs/k8s-lab/**'
      - 'go/golab/**'
      - 'labs/ivm/**'
      - 'labs/slatedb-oss/**'
      - 'labs/lab-viewer/**'
      - 'labs/llm/bench/**'
      - 'python/pylab/**'
      - 'python/projects/py-toydb/**'
      - 'tools/check_workspace_env.py'
      - 'tools/test_workspace_env.py'
      - 'tools/cpp_smoke.cc'
      - '.gitmodules'
      - 'cc/thirdparty/googletest'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'cc/cclab/**'
      - 'labs/runtime/pool/**'
      - '.github/workflows/core-quality.yml'
  pull_request:
    paths:
      - 'labs/k8s-lab/**'
      - 'go/golab/**'
      - 'labs/ivm/**'
      - 'labs/slatedb-oss/**'
      - 'labs/lab-viewer/**'
      - 'labs/llm/bench/**'
      - 'python/pylab/**'
      - 'python/projects/py-toydb/**'
      - 'tools/check_workspace_env.py'
      - 'tools/test_workspace_env.py'
      - 'tools/cpp_smoke.cc'
      - '.gitmodules'
      - 'cc/thirdparty/googletest'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'cc/cclab/**'
      - 'labs/runtime/pool/**'
      - '.github/workflows/core-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/k8s-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: labs/k8s-lab/go.mod
          cache: false
      - name: Format, vet, race and coverage
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 -coverprofile=coverage.out ./...
          go run ./cmd/demo
      - name: Format LeetCode programs
        working-directory: go/golab
        run: test -z "$(gofmt -l .)"
      - uses: actions/upload-artifact@v4
        with:
          name: k8s-lab-coverage
          path: labs/k8s-lab/coverage.out

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ivm, llm-benchmark, toydb, pylab-smoke, ruff-tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test selected offline core
        env:
          PROJECT: ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PROJECT" in
            ivm)
              python -m pip install pytest
              cd labs/ivm
              python -m unittest discover -s pyivm -p 'test_*.py' -v
              cd dbsp && python -m pytest -q
              ;;
            llm-benchmark)
              python -m pip install -e 'labs/llm/bench[dev]'
              cd labs/llm/bench
              python -m pytest tests -q
              ;;
            toydb)
              python -m pip install -e python/projects/py-toydb pytest
              cd python/projects/py-toydb
              python -m pytest tests -q
              ;;
            pylab-smoke)
              python -m pip install pytest duckdb==1.1.3 numpy==2.1.0
              cd python/pylab
              OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m pytest test/test_duckdb.py test/test_distributed_kmeans.py -q
              ;;
            ruff-tools)
              python -m pip install ruff
              ruff check tools/check_workspace_env.py tools/test_workspace_env.py labs/slatedb-oss/compare/duckdb_oss_compare.py
              ;;
          esac

  slatedb-oss-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/slatedb-oss
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format, clippy, and offline InMemory tests
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  lab-viewer-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install TypeScript CLI tools
        run: npm install -g typescript tsx
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

  ivm-rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.75.0', stable]
    defaults:
      run:
        working-directory: labs/ivm/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Format and lint (stable)
        if: matrix.toolchain == 'stable'
        run: |
          cargo fmt -- --check
          cargo clippy --offline --locked --all-targets -- -D warnings
      - name: Offline debug/release tests and asserted example
        run: |
          cargo test --offline --locked
          cargo test --offline --locked --release
          cargo run --offline --locked --release --example time_series

  cpp-sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned test dependency
        run: git submodule update --init -- cc/thirdparty/googletest
      - name: Configure
        run: >-
          cmake -S . -B build-sanitizer -DCMAKE_BUILD_TYPE=Debug
          -DXLAB_SANITIZER=${{ matrix.sanitizer }} -DXLAB_FETCH_DEPENDENCIES=OFF
      - name: Build
        run: cmake --build build-sanitizer --parallel 4
      - name: Tests with fatal sanitizer findings
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizer --output-on-failure --no-tests=error --timeout 60
