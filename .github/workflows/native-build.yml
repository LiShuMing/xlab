name: native-build

on:
  workflow_dispatch:
  push:
    paths:
      - CMakeLists.txt
      - cmake/**
      - tools/build-windows.ps1
      - cc/cclab/**
      - cc/projects/thread-pool/**
      - rust/rlab/**
      - rust/rdb/**
      - python/projects/py-toydb/**
      - .github/workflows/native-build.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - cmake/**
      - tools/build-windows.ps1
      - cc/cclab/**
      - cc/projects/thread-pool/**
      - rust/rlab/**
      - rust/rdb/**
      - python/projects/py-toydb/**
      - .github/workflows/native-build.yml

permissions:
  contents: read

jobs:
  windows-source:
    # Git for Windows rejects an unrelated legacy Java filename even with sparse
    # checkout. Package only native CI scopes on Linux; do not weaken Git safety.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact-checkout Windows sources
        run: >-
          tar -cf "${{ runner.temp }}/windows-source.tar"
          CMakeLists.txt cmake tools cc/cclab cc/projects/thread-pool
          rust/rlab rust/rdb python/projects/py-toydb
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-source
          path: ${{ runner.temp }}/windows-source.tar
          retention-days: 1

  cpp:
    needs: windows-source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: native-windows-source
          path: ${{ runner.temp }}/native-source
      - name: Extract exact-checkout Windows sources
        if: runner.os == 'Windows'
        shell: pwsh
        run: tar -xf "${{ runner.temp }}/native-source/windows-source.tar" -C "$env:GITHUB_WORKSPACE"
      - name: Windows build and tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build-windows.ps1 -Project cpp -Configuration ${{ matrix.configuration }} -Benchmarks
      - name: Linux configure
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DXLAB_FETCH_DEPENDENCIES=ON -DXLAB_BUILD_BENCHMARKS=ON
      - name: Linux build
        if: runner.os == 'Linux'
        run: cmake --build build --parallel 4
      - name: Linux tests
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 60

  rust:
    needs: windows-source
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-source
          path: ${{ runner.temp }}/native-source
      - name: Extract exact-checkout Windows sources
        shell: pwsh
        run: tar -xf "${{ runner.temp }}/native-source/windows-source.tar" -C "$env:GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - name: Workspace tests including doctests
        run: cargo test --manifest-path rust/rlab/Cargo.toml --workspace --locked --release
      - name: RDB tests
        run: cargo test --manifest-path rust/rdb/Cargo.toml --locked

  python:
    needs: windows-source
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-source
          path: ${{ runner.temp }}/native-source
      - name: Extract exact-checkout Windows sources
        shell: pwsh
        run: tar -xf "${{ runner.temp }}/native-source/windows-source.tar" -C "$env:GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test ToyDB in an isolated environment
        shell: pwsh
        run: ./tools/build-windows.ps1 -Project toydb
