name: repository-checks

# Changed-text policy applies to every PR and push, including code-only changes.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-and-healthcheck:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell syntax and committed-diff formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          bash -n tools/healthcheck.sh
          bash -n python/projects/py-ego/py-ego-miniapp/deploy/scripts/deploy.sh
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git rev-parse --verify "$HEAD_SHA^" 2>/dev/null || printf '%s' 4b825dc642cb6eb9a060e54bf8d69288fbee4904)
          elif [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            # New branch pushes have no before commit: compare its branch delta.
            if ! BASE_SHA=$(git merge-base "$HEAD_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" 2>/dev/null); then
              echo 'Cannot establish new-branch formatting baseline from the default branch.' >&2
              exit 2
            fi
          fi
          python3 tools/check_formatting.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Offline regression fixtures and maintained navigation
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Report current dependency debt separately
        # The repository intentionally retains orphan declarations for review.
        # Do not turn an expected diagnostic failure into a whole-repo pass.
        run: |
          set +e
          bash tools/healthcheck.sh > healthcheck-report.txt 2>&1
          result=$?
          cat healthcheck-report.txt
          printf '\nFull checkout healthcheck exit code: %s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          printf 'Fixture success is not a full repository health/build pass.\n' >> "$GITHUB_STEP_SUMMARY"
          # Keep the known 38 orphan declarations visible; fail any other error.
          failures=$(grep -c '^FAIL:' healthcheck-report.txt || true)
          orphans=$(grep -c '^FAIL: declaration without gitlink:' healthcheck-report.txt || true)
          if [ "$result" -ne 1 ] || [ "$failures" -ne 38 ] || [ "$orphans" -ne 38 ]; then
            echo 'Dependency diagnostics differ from the explicitly recorded baseline.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: healthcheck-${{ matrix.os }}
          path: healthcheck-report.txt
          retention-days: 7
