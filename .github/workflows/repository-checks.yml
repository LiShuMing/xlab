name: repository-checks

on:
  pull_request:
    paths:
      - '**/*.md'
      - docs/migrations/**
      - swift/**
      - .gitmodules
      - cc/thirdparty/googletest
      - cc/thirdparty/benchmark
      - tools/healthcheck.sh
      - tools/test_*.py
      - .github/workflows/repository-checks.yml
  push:
    paths:
      - '**/*.md'
      - docs/migrations/**
      - swift/**
      - .gitmodules
      - cc/thirdparty/googletest
      - cc/thirdparty/benchmark
      - tools/healthcheck.sh
      - tools/test_*.py
      - .github/workflows/repository-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-and-healthcheck:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell syntax and whitespace
        run: |
          bash -n tools/healthcheck.sh
          git diff --check
      - name: Offline regression fixtures and maintained navigation
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Report current dependency debt separately
        # The repository intentionally retains orphan declarations for review.
        # Do not turn an expected diagnostic failure into a whole-repo pass.
        run: |
          set +e
          bash tools/healthcheck.sh > healthcheck-report.txt 2>&1
          result=$?
          cat healthcheck-report.txt
          printf '\nFull checkout healthcheck exit code: %s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          printf 'Fixture success is not a full repository health/build pass.\n' >> "$GITHUB_STEP_SUMMARY"
          # Keep the known 67 orphan declarations visible; fail any other error.
          failures=$(grep -c '^FAIL:' healthcheck-report.txt || true)
          orphans=$(grep -c '^FAIL: declaration without gitlink:' healthcheck-report.txt || true)
          if [ "$result" -ne 1 ] || [ "$failures" -ne 67 ] || [ "$orphans" -ne 67 ]; then
            echo 'Dependency diagnostics differ from the explicitly recorded baseline.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: healthcheck-${{ matrix.os }}
          path: healthcheck-report.txt
          retention-days: 7
