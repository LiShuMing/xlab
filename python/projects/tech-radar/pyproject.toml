[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-radar"
version = "0.2.0"
description = "Extensible personal technology signal collector and publishing pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=2.0"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pillow>=11,<13"]

[project.scripts]
tech-radar = "tech_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
