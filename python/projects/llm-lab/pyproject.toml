[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xlab-llm-lab"
version = "0.1.0"
description = "Small, observable language-model learning experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3"]

[project.scripts]
llm-lab = "llm_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
