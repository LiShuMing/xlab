# Nginx 配置模板 —— Liminalis 微信公众号部署
# 用法:
#   1. 复制到 /etc/nginx/sites-available/liminalis
#   2. 替换 your-domain.example 为实际域名
#   3. 按需调整证书路径（Let's Encrypt 会自动处理）
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# 此配置支持:
#   - HTTP 自动跳转 HTTPS
#   - API 反代到 FastAPI (127.0.0.1:8010)
#   - SPA 前端静态资源服务 + history 路由回退
#   - WebSocket 支持（若后续需要）
#   - 微信 OAuth 所需的 X-Forwarded-* 头

# HTTP: 80 端口，强制跳转 HTTPS
server {
    listen 80;
    server_name your-domain.example;

    # Let's Encrypt ACME 挑战（ Certbot 会自动添加 location，此处预留）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: 443 端口
server {
    listen 443 ssl http2;
    server_name your-domain.example;

    # SSL 证书（由 Certbot 管理）
    ssl_certificate /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/liminalis.access.log;
    error_log /var/log/nginx/liminalis.error.log;

    client_max_body_size 10M;

    # ========================
    # API 反代 -> FastAPI
    # ========================
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持（SSE / 未来扩展）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 禁用 API 响应缓存
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ========================
    # 前端静态资源
    # ========================
    location / {
        root /opt/xlab/liminalis/dist;
        index index.html;

        # SPA history 模式回退
        try_files $uri $uri/ /index.html;

        # 静态资源长期缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|json|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ========================
    # 健康检查（直接透传后端）
    # ========================
    location = /health {
        proxy_pass http://127.0.0.1:8010/health;
        access_log off;
        proxy_set_header Host $host;
    }
}

# Map Connection header for WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
