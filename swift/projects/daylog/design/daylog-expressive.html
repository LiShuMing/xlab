<style>
#dl-expressive{--m-bg:light-dark(#f8f5fb,#211d28);--m-ink:light-dark(#30253e,#f1e8fc);--m-muted:light-dark(#786987,#c0afcc);--m-purple:light-dark(#eadff8,#443354);--m-purple2:light-dark(#f0e8f7,#342b40);--m-accent:light-dark(#65408c,#d6b6fa);--m-green:light-dark(#deefbd,#39472c);--m-greenink:light-dark(#435a2b,#d7ecb4);--m-white:light-dark(#fff,#2d2636);--m-line:light-dark(#dcd0e7,#594965);--m-primary:light-dark(#65408c,#d6b6fa);--m-onprimary:light-dark(#fff,#382247);font:14px/1.55 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:var(--m-ink)}
#dl-expressive *{box-sizing:border-box}#dl-expressive [hidden]{display:none!important}#dl-expressive button,#dl-expressive input,#dl-expressive textarea{font:inherit;color:inherit}#dl-expressive button{cursor:pointer}#dl-expressive button:focus-visible,#dl-expressive input:focus-visible,#dl-expressive textarea:focus-visible{outline:2px solid var(--m-accent);outline-offset:4px}#dl-expressive p,#dl-expressive h1,#dl-expressive h2{margin:0}#dl-expressive h1{font-size:43px;font-weight:500;line-height:1.2;letter-spacing:-1.8px}#dl-expressive h2{font-size:20px;font-weight:500;letter-spacing:-.5px}#dl-expressive .m-window{background:var(--m-bg);border-radius:25px;padding:22px 28px 20px;border:1px solid var(--m-line)}#dl-expressive .m-header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:30px}#dl-expressive .m-brand{display:flex;align-items:center;gap:10px;font-size:21px;letter-spacing:-.7px}#dl-expressive .m-symbol{border-radius:13px 5px 13px 5px;background:var(--m-accent);color:var(--m-bg);width:32px;height:32px;display:grid;place-items:center}#dl-expressive .m-nav{display:flex;gap:5px;border-radius:30px;background:var(--m-purple2);padding:5px}#dl-expressive .m-nav button{border:0;background:transparent;border-radius:25px;padding:8px 18px;color:var(--m-muted);font-size:12px}#dl-expressive .m-nav button[aria-pressed=true]{background:var(--m-primary);color:var(--m-onprimary)}#dl-expressive .m-date{font-size:12px;color:var(--m-muted)}#dl-expressive .m-intro{display:flex;justify-content:space-between;align-items:end;gap:22px;margin-bottom:24px;flex-wrap:wrap}#dl-expressive .m-sub{color:var(--m-muted);font-size:12px;margin-top:12px}#dl-expressive .m-pill{display:flex;align-items:center;gap:8px;border:0;border-radius:22px;background:var(--m-green);color:var(--m-greenink);padding:11px 17px;font-size:12px}#dl-expressive .m-grid{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.3fr);gap:14px}#dl-expressive .m-focus{background:var(--m-purple);border-radius:28px 28px 8px 28px;padding:25px;display:flex;flex-direction:column;justify-content:space-between;min-height:315px}#dl-expressive .m-label{font-size:11px;letter-spacing:1.5px;color:var(--m-accent)}#dl-expressive .m-focus h2{font-size:28px;line-height:1.4;margin:16px 0 25px;max-width:230px}#dl-expressive .m-focus-footer{display:flex;align-items:center;justify-content:space-between;gap:15px}#dl-expressive .m-disc{width:65px;height:65px;border-radius:50%;display:grid;place-items:center;background:var(--m-green);color:var(--m-greenink);font-size:27px;letter-spacing:-1px}#dl-expressive .m-focus-footer p{font-size:12px;color:var(--m-muted)}#dl-expressive .m-focus-footer span{font-size:11px}#dl-expressive .m-tasks{background:var(--m-purple2);border-radius:28px;padding:22px;min-width:0}#dl-expressive .m-sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}#dl-expressive .m-count{font-size:12px;color:var(--m-accent)}#dl-expressive .m-task{display:flex;gap:12px;align-items:center;background:var(--m-white);padding:14px;border-radius:7px;margin-top:3px;min-height:49px}#dl-expressive .m-task:first-child{border-radius:16px 16px 7px 7px}#dl-expressive .m-task:last-child{border-radius:7px 7px 16px 16px}#dl-expressive .m-task input{width:18px;height:18px;accent-color:var(--m-accent);flex-shrink:0}#dl-expressive .m-task span{overflow-wrap:anywhere}#dl-expressive .m-task:has(input:checked){background:var(--m-green);color:var(--m-greenink)}#dl-expressive .m-task:has(input:checked) span{text-decoration:line-through}#dl-expressive .m-form{display:flex;gap:8px;margin-top:12px}#dl-expressive .m-form input{min-width:0;width:100%;background:var(--m-white);border:0;border-radius:20px;padding:11px 14px;font-size:12px}#dl-expressive .m-add{border:0;border-radius:18px;background:var(--m-primary);color:var(--m-onprimary);padding:9px 16px;font-size:12px;white-space:nowrap}#dl-expressive .m-bottom{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.87fr);gap:14px;margin-top:14px}#dl-expressive .m-notes{background:var(--m-white);border:1px solid var(--m-line);border-radius:22px;padding:20px}#dl-expressive .m-notes h2{font-size:16px}#dl-expressive .m-log{font-size:13px;margin-top:10px;overflow-wrap:anywhere}#dl-expressive .m-log time{color:var(--m-muted);font-size:11px;display:inline-block;margin-right:8px}#dl-expressive .m-review{background:var(--m-green);color:var(--m-greenink);border-radius:8px 24px 24px 24px;padding:22px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:16px}#dl-expressive .m-review h2{font-size:19px}#dl-expressive .m-review p{font-size:12px;margin-top:6px}#dl-expressive .m-review button{border:0;border-radius:25px;padding:9px 16px;background:var(--m-greenink);color:var(--m-green);font-size:12px}#dl-expressive .m-draft{white-space:pre-wrap;line-height:1.8;background:var(--m-white);border-radius:20px;padding:20px;margin-top:15px}#dl-expressive .m-status{font-size:11px;color:var(--m-muted);margin-top:18px}#dl-expressive .m-history{background:var(--m-purple2);padding:28px;border-radius:25px}#dl-expressive .m-history p{margin-top:12px}#dl-expressive .m-editor{width:100%;min-height:240px;border:0;border-radius:25px;padding:24px;background:var(--m-white);resize:vertical}#dl-expressive[data-shape=quiet] .m-focus,#dl-expressive[data-shape=quiet] .m-tasks,#dl-expressive[data-shape=quiet] .m-review{border-radius:16px}
@media(max-width:650px){#dl-expressive .m-grid,#dl-expressive .m-bottom{grid-template-columns:1fr}#dl-expressive .m-focus{min-height:210px}#dl-expressive .m-focus h2{max-width:none}#dl-expressive .m-window{padding:20px}#dl-expressive .m-date{display:none}#dl-expressive h1{font-size:35px}#dl-expressive .m-header{gap:15px}#dl-expressive .m-nav button{padding:8px 13px}}
@media(pointer:coarse){#dl-expressive button{min-height:44px}#dl-expressive input,#dl-expressive textarea{font-size:16px!important}}
</style>
<div id="dl-expressive" aria-label="方案 B · Material 3 Expressive" data-shape="expressive">
 <div class="m-window">
  <header class="m-header"><div class="m-brand"><span class="m-symbol"><i data-lucide="asterisk" aria-hidden="true"></i></span>DayLog</div><nav class="m-nav" aria-label="主导航"><button data-page="today" aria-pressed="true">今天</button><button data-page="history" aria-pressed="false">历史</button><button data-page="journal" aria-pressed="false">日记</button></nav><span class="m-date">9 月 18 日 · 星期五</span></header>
  <div class="m-intro"><div><h1 data-title>为重要的事，<br>留出空间。</h1><p class="m-sub">安排今天，记录进展。其余的，慢慢来。</p></div><button class="m-pill" data-jump><i data-lucide="plus" aria-hidden="true"></i>新建待办</button></div>
  <div data-screen="today">
   <div class="m-grid">
    <section class="m-focus"><div><span class="m-label">ONE THING TODAY</span><h2>确定 DayLog<br>的视觉方向。</h2></div><div class="m-focus-footer"><p>今天的重点<br><span>把想法变成可见的界面</span></p><div class="m-disc" aria-label="9月18日">18</div></div></section>
    <section class="m-tasks"><div class="m-sectionhead"><h2>今天要做</h2><span class="m-count" data-count>1 / 4 完成</span></div><div data-tasks><label class="m-task"><input type="checkbox"><span>确定应用的视觉方向</span></label><label class="m-task"><input type="checkbox"><span>完善工作日记设计文档</span></label><label class="m-task"><input type="checkbox"><span>整理本周阅读笔记</span></label><label class="m-task"><input type="checkbox" checked><span>检查 Swift 开发环境</span></label></div><form class="m-form" data-taskform><input aria-label="新增待办" placeholder="接下来，做什么？" maxlength="150"><button class="m-add" type="submit">添加</button></form></section>
   </div>
   <div class="m-bottom"><section class="m-notes"><h2>随手记一笔</h2><div data-log><p class="m-log"><time>14:20</time>快速输入放进菜单栏，主窗口专注整理。</p></div><form class="m-form" data-noteform><input aria-label="新增随记" placeholder="刚刚的小发现…" maxlength="500"><button class="m-add" type="submit">记下</button></form></section><section class="m-review"><div><h2>把今天，收好。</h2><p>从待办到工作回顾，只差一步。</p></div><button data-summary>生成今日回顾 ↗</button></section></div>
   <div class="m-draft" data-draft hidden></div>
  </div>
  <div class="m-history" data-screen="history" hidden><h2>9 月 17 日 · 昨天</h2><p>完成 2 / 3 项任务</p><p>完成查询回归复现与 Code Review，阅读笔记待继续。</p></div>
  <div data-screen="journal" hidden><textarea class="m-editor" aria-label="个人日记" placeholder="写一点工作之外的事。个人日记默认不参与工作总结。"></textarea></div>
  <p class="m-status" role="status" aria-live="polite">交互稿 · 演示数据不会保存</p>
 </div>
</div>
<script>
(()=>{const r=document.getElementById('dl-expressive'),q=s=>r.querySelector(s),all=s=>[...r.querySelectorAll(s)],settings={appearance:'system',shape:'expressive'};function update(){const cs=all('[data-tasks] input');q('[data-count]').textContent=`${cs.filter(c=>c.checked).length} / ${cs.length} 完成`;q('[data-draft]').hidden=true}r.addEventListener('change',e=>{if(e.target.matches('[data-tasks] input')){update();q('.m-status').textContent='完成状态已更新（演示）。'}});function page(name){all('[data-page]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.page===name)));all('[data-screen]').forEach(x=>x.hidden=x.dataset.screen!==name);q('[data-title]').textContent={today:'为重要的事，留出空间。',history:'回看每一个日常。',journal:'写给自己的片刻。'}[name];q('[data-jump]').hidden=name!=='today'}all('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));q('[data-jump]').onclick=()=>q('[data-taskform] input').focus();function form(sel,fn){const f=q(sel),i=f.querySelector('input');let composing=false;i.oncompositionstart=()=>composing=true;i.oncompositionend=()=>composing=false;i.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.isComposing||e.keyCode===229))e.preventDefault()});f.onsubmit=e=>{e.preventDefault();if(composing||!i.value.trim())return;fn(i.value.trim());i.value='';update()}}form('[data-taskform]',text=>{const l=document.createElement('label');l.className='m-task';const i=document.createElement('input');i.type='checkbox';const s=document.createElement('span');s.textContent=text;l.append(i,s);q('[data-tasks]').append(l)});form('[data-noteform]',text=>{const p=document.createElement('p');p.className='m-log';const t=document.createElement('time');t.textContent='刚刚';p.append(t,document.createTextNode(text));q('[data-log]').prepend(p)});q('[data-summary]').onclick=()=>{const titles=all('.m-task').filter(x=>x.querySelector('input').checked).map(x=>x.querySelector('span').textContent);q('[data-draft]').textContent='今日回顾 · 演示草稿\n\n已完成：'+(titles.join('、')||'暂无完成记录')+'。\n下一步建议：为尚未完成的事项补充具体进展。\n\n本地规则生成，未调用模型。';q('[data-draft]').hidden=false};function render(){settings.appearance==='system'?r.style.removeProperty('color-scheme'):r.style.colorScheme=settings.appearance;r.dataset.shape=settings.shape}update();render();if(globalThis.Tweak){const t=new Tweak({container:r,onChange:render});t.addSelect(settings,'appearance',{label:'外观',options:[{label:'跟随系统',value:'system'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});t.addSelect(settings,'shape',{label:'形状表达',options:[{label:'鲜明',value:'expressive'},{label:'克制',value:'quiet'}]})}})();
</script>
